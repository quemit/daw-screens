<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Showing | The Warehouse @ King Mill</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#F3EBDD;cursor:none}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="tv" src="https://tinyurl.com/daw-cooking" allow="autoplay; fullscreen; screen-wake-lock" title="Now Showing"></iframe>
<script>
/* Self-healing: the player inside says "alive" every 15 seconds. If it goes quiet for
   2 minutes (stuck or crashed frame), reload it. Only arms after the first "alive". */
var last = 0;
window.addEventListener('message', function (e) { if (e.data === 'daw-alive') last = Date.now(); });
setInterval(function () {
  if (last && Date.now() - last > 120000) { last = 0; var f = document.getElementById('tv'); f.src = f.src; }
}, 15000);
</script>
</body>
</html>
